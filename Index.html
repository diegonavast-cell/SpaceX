<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">
    <title>SpaceX</title>
</head>
<body>
    <div class="cajaprincipal">
        <div class="caja caja1">
            <div class="caja3">
                <h2>Registro</h2>

                <label>Nombre</label>
                <input id="nombre" type="text" placeholder="Ingresa tu nombre">

                <label>Apellido</label>
                <input id="apellido" type="text" placeholder="Ingresa tu apellido">

                <label>Numero de telefono</label>
                <input id="telefonoRegistro" type="text" placeholder="Ingresa tu numero de telefono">

                <label>Contraseña</label>
                <input id="contraseñaRegistro" type="password" placeholder="Crea una contraseña">

                <button onclick="registrar()">Registrarse</button>
            </div>
        </div>

        <div class="caja caja2">
            <div class="caja4">
                <h2>Iniciar sesión</h2>

                <label>Telefono</label>
                <input id="telefono" type="text" placeholder="Tu telefono">

                <label>Contraseña</label>
                <input id="contraseña" type="password" placeholder="Tu contraseña">

                <button onclick="iniciarSesion()">Iniciar sesión</button>
            </div>
        </div>
    </div>

    <script src="Codigo.js"></script>
</body>
</html>
